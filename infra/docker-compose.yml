name: hr-hub

services:
  postgres:
    image: postgres:16-alpine
    container_name: hrhub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hrhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hrhub_dev}
      POSTGRES_DB: ${POSTGRES_DB:-hrhub}
    ports:
      # Host 5434 avoids conflict with local Postgres on 5432
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hrhub} -d ${POSTGRES_DB:-hrhub}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: hrhub-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  nats:
    image: nats:2.10-alpine
    container_name: hrhub-nats
    restart: unless-stopped
    command: ["-js", "-m", "8222"]
    ports:
      - "${NATS_PORT:-4222}:4222"
      - "8222:8222"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: hrhub-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Optional: run apps in containers (local-dev usually runs apps on host)
  # Uncomment when Dockerfiles are ready for full stack in compose.
  # api:
  #   build: ../apps/api
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  # web:
  #   build: ../apps/web
  # device-gw:
  #   build: ../apps/device-gw

volumes:
  postgres_data:
  redis_data:
  minio_data:
